name: 🐍 Generate Snake Animation

on:
  # Har 12 soatda avtomatik ishlaydi
  schedule:
    - cron: "0 */12 * * *"

  # GitHub Actions oynasidan qo'lda ishga tushirish
  workflow_dispatch:

  # main branch'ga push bo'lganda ishlaydi
  push:
    branches:
      - main

permissions:
  contents: write

jobs:

  generate-snake:

    name: 🐍 Generate Snake

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # Generate Snake Animation
      # =====================================================

      - name: 🐍 Generate GitHub Contribution Snake

        uses: Platane/snk@v3

        with:

          github_user_name: ${{ github.repository_owner }}

          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark


      # =====================================================
      # Publish Snake to output branch
      # =====================================================

      - name: 🚀 Publish Snake

        uses: crazy-max/ghaction-github-pages@v4

        with:

          build_dir: dist

        env:

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
